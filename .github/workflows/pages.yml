# Publishes Slag to GitHub Pages.
#
# The game is plain static files (index.html + styles.css + src/), so there is
# nothing to build — the repository root is uploaded as-is.
#
# Pages serves over HTTPS, which matters more than it looks: the Gamepad API is
# a secure-context feature, so a plain http:// host silently hides every
# controller. Any HTTPS static host works the same way; see README §9.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do let a queued one finish rather than
# cancelling it — a cancelled deploy would leave the previous version live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the static entry points
        run: |
          test -f index.html
          test -f styles.css
          test -f src/main.js
          node --check src/main.js

      # A Pages bekapcsolása admin jog: a beépített GITHUB_TOKEN nem tudja
      # megtenni ("Resource not accessible by integration"), és az
      # `enablement: true` sem segít. Ezért megnézzük, be van-e kapcsolva, és
      # ha nincs, a futás NEM bukik el pirosra minden pushnál — kiírjuk a
      # job összegzőjébe, pontosan mit kell egyszer beállítani.
      - name: Be van-e kapcsolva a Pages?
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## A GitHub Pages még nincs bekapcsolva"
              echo ""
              echo "A publikálás egyszeri beállítást igényel (a workflow ezt"
              echo "jogosultság híján nem tudja elvégezni helyetted):"
              echo ""
              echo "**Settings → Pages → Build and deployment → Source: _GitHub Actions_**"
              echo ""
              echo "Ezután a következő push már magától publikál ide:"
              echo "\`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
